pre-commit:
  parallel: true
  commands:
    build:
      tags: build
      run: just build
    check-js:
      tags: style
      glob: "*.{js,jsx,mjs,ts,tsx,mts}"
      run: just check-js
    check-json:
      tags: style
      glob: "*.json"
      run: just check-json
    check-yaml:
      tags: style
      glob: "*.{yml,yaml}"
      run: just check-yaml
    lint-js:
      tags: lint
      glob: "*.{js,jsx,mjs,ts,tsx,mts}"
      run: just lint-js
    lint-markdown:
      tags: documentation style
      glob: "*.md"
      run: just lint-markdown
    test:
      tags: test
      run: just test
format:
  parallel: true
  commands:
    format-js:
      tags: style
      glob: "*.{js,jsx,mjs,ts,tsx,mts}"
      run: just format-js
    format-json:
      tags: style
      glob: "*.json"
      run: just format-json
    format-yaml:
      tags: style
      glob: "*.{yml,yaml}"
      run: just format-yaml
commit-msg:
  commands:
    commitlint:
      run: commitlint --edit={1}
